# POKY_BBLAYERS_CONF_VERSION is increased each time build/conf/bblayers.conf
# changes incompatibly
POKY_BBLAYERS_CONF_VERSION = "2"

BBPATH = "${TOPDIR}"
BBFILES ?= ""


BBLAYERS ?= " \
  ${TOPDIR}/../meta \
  ${TOPDIR}/../meta-poky \
  ${TOPDIR}/../meta-yocto-bsp \
  ${TOPDIR}/../meta-openembedded/meta-oe \
  ${TOPDIR}/../meta-openembedded/meta-python \
  ${TOPDIR}/../meta-openembedded/meta-filesystems \
  ${TOPDIR}/../meta-openembedded/meta-networking \
  ${TOPDIR}/../meta-openembedded/meta-multimedia \
  ${TOPDIR}/../meta-virtualization \
  ${TOPDIR}/../meta-clang \
  ${TOPDIR}/../meta-qt5 \
  ${TOPDIR}/../meta-raspberrypi \
  ${TOPDIR}/../meta-webkit \
  ${TOPDIR}/../meta-python2 \
  ${TOPDIR}/../meta-dac-sdk \
  ${TOPDIR}/../meta-rdk-video \
"

BBLAYERS += "${@'${TOPDIR}/../meta-cmf' if os.path.isfile('${TOPDIR}/../meta-cmf/conf/layer.conf') else ''}"
BBLAYERS += "${@'${TOPDIR}/../meta-rdk' if os.path.isfile('${TOPDIR}/../meta-rdk/conf/layer.conf') else ''}"
BBLAYERS += "${@'${TOPDIR}/../meta-rdk-ext' if os.path.isfile('${TOPDIR}/../meta-rdk-ext/conf/layer.conf') else ''}"
BBLAYERS += "${@'${TOPDIR}/../meta-rdk-cobalt' if os.path.isfile('${TOPDIR}/../meta-rdk-cobalt/conf/layer.conf') else ''}"
BBLAYERS += "${@'${TOPDIR}/../meta-rdk-flutter' if os.path.isfile('${TOPDIR}/../meta-rdk-flutter/conf/layer.conf') else ''}"

