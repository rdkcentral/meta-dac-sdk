# POKY_BBLAYERS_CONF_VERSION is increased each time build/conf/bblayers.conf
# changes incompatibly
POKY_BBLAYERS_CONF_VERSION = "2"

BBPATH = "${TOPDIR}"
BBFILES ?= ""


BBLAYERS ?= " \
  ${TOPDIR}/../meta \
  ${TOPDIR}/../meta-poky \
  ${TOPDIR}/../meta-yocto-bsp \
  ${TOPDIR}/../meta-openembedded/meta-oe \
  ${TOPDIR}/../meta-openembedded/meta-python \
  ${TOPDIR}/../meta-openembedded/meta-filesystems \
  ${TOPDIR}/../meta-openembedded/meta-networking \
  ${TOPDIR}/../meta-openembedded/meta-multimedia \
  ${TOPDIR}/../meta-virtualization \
  ${TOPDIR}/../meta-clang \
  ${TOPDIR}/../meta-qt5 \
  ${TOPDIR}/../meta-raspberrypi \
  ${TOPDIR}/../meta-webkit \
  ${TOPDIR}/../meta-python2 \
  ${TOPDIR}/../meta-dac-sdk \
  ${TOPDIR}/../meta-rdk-video \
  ${TOPDIR}/../meta-rdk-flutter \
"

BBLAYERS += "${@d.getVar('MANIFEST_PATH_CMF') if d.getVar('MANIFEST_PATH_CMF') is not None and os.path.isfile(d.getVar('MANIFEST_PATH_CMF') + '/conf/layer.conf') else ''}"
BBLAYERS += "${@d.getVar('MANIFEST_PATH_RDK') if d.getVar('MANIFEST_PATH_RDK') is not None and os.path.isfile(d.getVar('MANIFEST_PATH_RDK') + '/conf/layer.conf') else ''}"
BBLAYERS += "${@d.getVar('MANIFEST_PATH_RDK_EXT') if d.getVar('MANIFEST_PATH_RDK_EXT') is not None and os.path.isfile(d.getVar('MANIFEST_PATH_RDK_EXT') + '/conf/layer.conf') else ''}"
BBLAYERS += "${@d.getVar('MANIFEST_PATH_RDK_COBALT') if d.getVar('MANIFEST_PATH_RDK_COBALT') is not None and os.path.isfile(d.getVar('MANIFEST_PATH_RDK_COBALT') + '/conf/layer.conf') else ''}"
